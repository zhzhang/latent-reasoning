# Step-Audio-2-mini-Think for MMAR text understanding (thinker-only).
# Omni 0.26 registers step_audio_2; pipeline step_audio_2_asr is a single
# stage (no Token2Wav). Official yaml uses TP=2 on two GPUs; this is TP=1
# on one L40S. Prefix caching reuses n-shot prefixes (Omni cannot use
# SamplingParams n>1). Official max_num_seqs is 1; text-only MMAR can batch.
#
# Encoder dummy profiling runs one max-length (25s / ~250 tok) audio item
# per (max_num_batched_tokens / 250) slots, and that encoder cache stays
# allocated. 8192 → 32 clips and 2048 → 8 clips both filled the L40S
# (~44 GiB) before KV allocation.
#
# The encoder n_ctx is 1500 (~30s). Unchunked 30s+ MMAR wavs crash with
# 1501 vs 1500. Official stepaudio2.py splits at 25s; MMAR max is 56s so
# a prompt can carry 3 windows (3×250=750 audio tokens plus text). 512
# could not schedule that prefill. 1024 → 4 dummy 25s slots, still under
# the 8-clip OOM. limit_mm_per_prompt audio=3 matches the 3-chunk cap.
#
# gpu_memory_utilization is 0.50 so the KV estimate (util * GPU − weights)
# still fits after the larger encoder cache. 0.70 counted 31 GiB of KV as
# free while only ~300 MiB actually remained.
#
# Official Omni 0.26 Step-Audio2 yaml uses enforce_eager; this path tries
# CUDA graphs (unlike MiMo, no known CPU→CUDA copy during capture).
pipeline: step_audio_2_asr
async_chunk: false
dtype: bfloat16
trust_remote_code: true
enable_prefix_caching: true

stages:
  - stage_id: 0
    devices: "0"
    tensor_parallel_size: 1
    max_num_seqs: 16
    gpu_memory_utilization: 0.50
    enforce_eager: false
    trust_remote_code: true
    enable_prefix_caching: true
    async_scheduling: false
    max_num_batched_tokens: 1024
    max_model_len: 8192
    limit_mm_per_prompt:
      audio: 3
    default_sampling_params:
      temperature: 0.7
      top_p: 1.0
      top_k: -1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05
