# Step-Audio-2-mini-Think for MMAR text understanding (2-stage Omni pipeline).
# Requests set modalities=["text"] so Token2Wav is skipped.
# Memory split sized for one A100-80GB (both stages on device 0).
# Stage 0: prefix caching on for duplicate n-shot prompt reuse (Omni cannot use
# SamplingParams n>1). max_num_seqs stays 1 for the two-stage memory split.
# Thinker sampling matches Step-Audio2 audio_to_text (T=0.7, top_p=0.9, rep=1.05).
async_chunk: false
dtype: bfloat16
trust_remote_code: true

connectors:
  connector_of_shared_memory:
    name: SharedMemoryConnector
    extra:
      shm_threshold_bytes: 365536
      codec_streaming: true
      connector_get_sleep_s: 0.001
      connector_get_max_wait_first_chunk: 3000
      connector_get_max_wait: 300
      codec_chunk_frames: 30
      codec_left_context_frames: 40

stages:
  - stage_id: 0
    max_num_seqs: 1
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.60
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: true
    max_num_batched_tokens: 8192
    max_model_len: 8192
    devices: "0"
    output_connectors:
      to_stage_1: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.7
      top_p: 0.9
      top_k: -1
      max_tokens: 2048
      seed: 42
      repetition_penalty: 1.05

  - stage_id: 1
    max_num_seqs: 1
    tensor_parallel_size: 1
    gpu_memory_utilization: 0.25
    enforce_eager: true
    trust_remote_code: true
    enable_prefix_caching: false
    async_scheduling: false
    max_num_batched_tokens: 2048
    max_model_len: 2048
    devices: "0"
    input_connectors:
      from_stage_0: connector_of_shared_memory
    default_sampling_params:
      temperature: 0.0
      top_p: 1.0
      top_k: -1
      max_tokens: 1
      seed: 42
